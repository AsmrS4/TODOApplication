version: '3.9'

services:
  backend:
    image: 'backend-image:latest'
    container_name: 'backend-app'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/todo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - '8092:8092'
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: 'postgres:15'
    container_name: 'todos_db'
    environment:
      - POSTGRES_DB=todo
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d todo" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - todo-db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - app-network

volumes:
  todo-db_data:

networks:
  app-network:
    driver: bridge